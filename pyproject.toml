[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end runs that train models or execute notebooks",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "data", "reports", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
